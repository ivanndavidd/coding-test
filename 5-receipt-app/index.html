<!doctype html>
<html>
<head>
  <title>Food Receipt AI</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 40px auto; }
    pre { background: #eee; padding: 10px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>1. Upload receipt</h2>
  <input type="file" id="file">
  <button onclick="upload()">Upload</button>
  <pre id="result">-</pre>

  <h2>2. Ask</h2>
  <input type="text" id="question" size="50" placeholder="what food did i buy yesterday?">
  <button onclick="ask()">Ask</button>
  <pre id="answer">-</pre>

  <script>
    async function upload() {
      const form = new FormData();
      form.append("file", document.getElementById("file").files[0]);
      const res = await fetch("/upload", { method: "POST", body: form });
      document.getElementById("result").textContent = JSON.stringify(await res.json(), null, 2);
    }

    async function ask() {
      const question = document.getElementById("question").value;
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question })
      });
      document.getElementById("answer").textContent = (await res.json()).answer;
    }
  </script>
</body>
</html>
